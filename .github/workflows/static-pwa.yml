name: Static PWA checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: betriz-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
