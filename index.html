<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#141e30;--line:#29364b;--text:#edf3ff;--muted:#a7b5ca;--accent:#66e0c2;--warn:#ffcc80;--danger:#ff8a9a;--success:#7dcea0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.65;padding-bottom:70px;-webkit-font-smoothing:antialiased}
header{padding:14px 16px;background:#101827;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
h1{font-size:21px;color:var(--accent);font-weight:700}
header p{font-size:12px;color:var(--muted);margin-top:2px}
main{max-width:920px;margin:0 auto;padding:12px}
nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 14px;position:sticky;top:58px;background:var(--bg);padding:6px 0;z-index:90}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#1e2a3d;color:var(--text);padding:8px 11px;border-radius:9px;font-size:12.5px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#06221c;border-color:var(--accent);font-weight:700}
button.danger{border-color:#a94d58;color:var(--danger)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
h2{font-size:15.5px;margin-bottom:10px;color:#e0eaff}
h3{font-size:13.5px;margin:12px 0 6px;color:#c5d4e8}
.muted{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:7px}
.stat{background:#0f1828;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.stat strong{display:block;font-size:14.5px;color:var(--accent);margin-bottom:2px}
label{display:block;margin:9px 0 4px;font-size:12.5px;color:#c8d6ea}
input,textarea,select{width:100%;padding:9px 11px;border-radius:8px;background:#0b1423;border:1px solid var(--line);color:var(--text);font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.row button{flex:1;min-width:95px}
.status{display:inline-block;padding:2px 8px;border-radius:6px;background:#27374a;color:var(--warn);font-size:11px;margin-top:4px}
.item{background:#0f1828;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:7px;overflow-wrap:anywhere}
.item p{margin:2px 0;font-size:13.5px}
section[hidden]{display:none!important}
.notice{background:#241f19;border-right:3px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;color:#e8d9b5}
.chat-box{max-height:340px;overflow-y:auto;background:#0f1828;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:9px}
.msg{margin:7px 0;padding:8px 11px;border-radius:10px;max-width:91%;font-size:13.5px;line-height:1.55}
.msg.user{background:#1a3358;margin-right:auto}
.msg.assistant{background:#152e28;margin-left:auto;border:1px solid #2a4a40}
.msg small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.badge{display:inline-block;background:#1a3a32;color:var(--accent);padding:1px 7px;border-radius:5px;font-size:10.5px;margin-left:5px}
.code-block{background:#0a1220;border:1px solid #2a3a50;border-radius:8px;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow-x:auto;margin:8px 0;direction:ltr;text-align:left}
footer{position:fixed;bottom:0;width:100%;background:#101827;border-top:1px solid var(--line);text-align:center;padding:10px;font-size:11px;color:var(--muted);z-index:80}
</style>
</head>
